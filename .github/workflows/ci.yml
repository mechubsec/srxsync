name: ci

# Lint, type-check, and unit tests. Security scanning (gitleaks, bandit,
# pip-audit) lives in security.yml. Integration tests require a real vSRX
# lab and are intentionally not run here.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + mypy + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install package with dev extras
        run: pip install -e .[dev]
      - name: ruff
        run: ruff check .
      - name: mypy
        run: mypy srxsync
      - name: pytest (unit only)
        run: pytest tests/unit
